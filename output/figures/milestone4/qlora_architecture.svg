<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172554; }
      .label { font: 600 19px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Arial, sans-serif; fill: #334155; }
      .box { stroke-width: 2.2; rx: 14; }
      .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .train { stroke: #b45309; stroke-width: 2.4; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1200" height="390" fill="#ffffff"/>
  <text x="600" y="38" text-anchor="middle" class="title">QLoRA Adaptation of Qwen3-4B</text>

  <rect x="38" y="92" width="185" height="92" class="box" fill="#eff6ff" stroke="#2563eb"/>
  <text x="130" y="126" text-anchor="middle" class="label">Question</text>
  <text x="130" y="153" text-anchor="middle" class="small">+ M-Schema</text>

  <rect x="270" y="92" width="190" height="92" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="365" y="126" text-anchor="middle" class="label">Tokenizer</text>
  <text x="365" y="153" text-anchor="middle" class="small">Chat template</text>

  <rect x="515" y="78" width="240" height="120" class="box" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="635" y="119" text-anchor="middle" class="label">Frozen Qwen3</text>
  <text x="635" y="147" text-anchor="middle" class="small">4-bit NF4 storage</text>
  <text x="635" y="173" text-anchor="middle" class="small">BF16 computation</text>

  <rect x="808" y="92" width="165" height="92" class="box" fill="#f8fafc" stroke="#64748b"/>
  <text x="890" y="126" text-anchor="middle" class="label">LM Head</text>
  <text x="890" y="153" text-anchor="middle" class="small">Token logits</text>

  <rect x="1020" y="92" width="142" height="92" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="1091" y="126" text-anchor="middle" class="label">SQL</text>
  <text x="1091" y="153" text-anchor="middle" class="small">tokens</text>

  <path d="M223 138 H270" class="arrow"/>
  <path d="M460 138 H515" class="arrow"/>
  <path d="M755 138 H808" class="arrow"/>
  <path d="M973 138 H1020" class="arrow"/>

  <rect x="500" y="270" width="270" height="88" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="635" y="303" text-anchor="middle" class="label">Trainable LoRA A/B</text>
  <text x="635" y="331" text-anchor="middle" class="small">r=16, α=32, all-linear</text>

  <rect x="915" y="270" width="247" height="88" class="box" fill="#fef2f2" stroke="#dc2626"/>
  <text x="1038" y="303" text-anchor="middle" class="label">Assistant-only loss</text>
  <text x="1038" y="331" text-anchor="middle" class="small">Causal cross-entropy</text>

  <path d="M635 270 V210" class="train"/>
  <path d="M1091 184 V235 H1038 V270" class="arrow"/>
  <path d="M915 314 H770" class="train"/>

  <text x="190" y="344" class="small">Frozen backbone participates in both passes;</text>
  <text x="190" y="369" class="small">optimizer updates only the LoRA parameters.</text>
</svg>
